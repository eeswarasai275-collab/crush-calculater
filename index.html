<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question for You 💕</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* Floating Hearts Background */
    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      animation: floatUp 8s linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
      text-align: center;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .card h1 {
      color: #ff3366;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ff4d79;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ffe0e9;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      background: #fff;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #ff4d79;
      box-shadow: 0 0 10px rgba(255, 77, 121, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff4d79, #ff3366);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 51, 102, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Secret Invisible Trigger Area */
    .admin-trigger {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 60px;
      height: 60px;
      z-index: 9999;
      opacity: 0;
    }

    /* Admin Vault Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: #333;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .vault-item {
      background: #fff0f3;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 4px solid #ff3366;
      text-align: left;
    }

    .vault-item p {
      margin: 2px 0;
      font-size: 0.9rem;
      color: #333;
    }

    .vault-item span {
      font-weight: 600;
      color: #ff3366;
    }

    /* Thank You State */
    .hidden {
      display: none !important;
    }

    .thank-you-box {
      text-align: center;
    }

    .thank-you-box h2 {
      color: #ff3366;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .thank-you-box p {
      color: #555;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Card Form -->
  <div class="card" id="formCard">
    <h1>Secret Valentine Trap 💕</h1>
    <p>Find out who your true secret admirer is!</p>
    
    <form id="trapForm">
      <div class="form-group">
        <label for="victimName">Your Name ✨</label>
        <input type="text" id="victimName" placeholder="Enter your full name" required autocomplete="off">
      </div>
      
      <div class="form-group">
        <label for="crushName">Who is your Crush? 💖</label>
        <input type="text" id="crushName" placeholder="Enter their name" required autocomplete="off">
      </div>
      
      <button type="submit" class="btn-submit" id="submitBtn">Reveal Secret 😍</button>
    </form>
  </div>

  <!-- Thank You Screen -->
  <div class="card hidden" id="thankYouCard">
    <div class="thank-you-box">
      <h2>Gotcha! 💖</h2>
      <p>Your secret is safe with us... or is it? 😉</p>
    </div>
  </div>

  <!-- Invisible Triple-Tap Admin Trigger -->
  <div class="admin-trigger" id="adminTrigger"></div>

  <!-- Admin Vault Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔒 Admin Vault</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div id="vaultData">
        <p style="color: #666; text-align: center;">Loading recorded entries...</p>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyMGpNgjvavFRFS-nr2R_zdoxArj3sOOi-8jKF-6FlOzTTFg-FubDOKNhlu5s8njOw7Jg/exec";
    const ADMIN_PASSWORD = "sai275275";

    // Create floating hearts background
    function createHearts() {
      const hearts = ['💖', '💕', '💗', '💓', '🌸', '✨'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-bg';
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    // Form Submission Handler
    const form = document.getElementById('trapForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const victim = document.getElementById('victimName').value.trim();
      const crush = document.getElementById('crushName').value.trim();

      if (!victim || !crush) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing... 💕";

      // Send data to Google Apps Script
      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
          'victimName': victim,
          'crushName': crush
        })
      })
      .then(() => {
        showThankYou();
      })
      .catch((error) => {
        console.error('Error:', error);
        showThankYou();
      });
    });

    function showThankYou() {
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('thankYouCard').classList.remove('hidden');
      
      // Trigger Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Admin Vault Trigger Mechanics
    let tapCount = 0;
    let tapTimer;
    const trigger = document.getElementById('adminTrigger');

    trigger.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1000);

      if (tapCount >= 3) {
        tapCount = 0;
        promptAdminLogin();
      }
    });

    // Shortcut Ctrl+Shift+E for Desktop
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        promptAdminLogin();
      }
    });

    function promptAdminLogin() {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === ADMIN_PASSWORD) {
        openVault();
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    function openVault() {
      const modal = document.getElementById('adminModal');
      const vaultData = document.getElementById('vaultData');
      modal.style.display = 'flex';

      vaultData.innerHTML = '<p style="color: #666; text-align: center;">Fetching live records...</p>';

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if (data.length === 0) {
            vaultData.innerHTML = '<p style="color: #666; text-align: center;">No responses recorded yet.</p>';
            return;
          }
          vaultData.innerHTML = '';
          data.slice().reverse().forEach(entry => {
            const item = document.createElement('div');
            item.className = 'vault-item';
            item.innerHTML = `
              <p><span>Victim:</span> ${escapeHtml(entry.victim)}</p>
              <p><span>Crush:</span> ${escapeHtml(entry.crush)}</p>
              <p style="font-size: 0.75rem; color: #999; margin-top: 4px;">${escapeHtml(entry.timestamp)}</p>
            `;
            vaultData.appendChild(item);
          });
        })
        .catch(err => {
          vaultData.innerHTML = '<p style="color: red; text-align: center;">Error fetching entries.</p>';
        });
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('adminModal').style.display = 'none';
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
